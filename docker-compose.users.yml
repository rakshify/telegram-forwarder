# Static per-user compose layout — alternative to forwarder.sh.
#
# Use this file when you want compose to be the single source of truth
# for which forwarders should be running. Each user is a service; adding
# a user means appending a 4-line block; `docker compose up -d` reconciles
# state. See README section 8 for the trade-off vs the dynamic script.
#
# How to use:
#   1. Build the image (compose still owns the build):
#        docker compose build
#      (yes, plain `docker compose build` — it reads ./docker-compose.yml,
#      which keeps the build context. This file reuses that image.)
#
#   2. For one-off operations (login, list-users, etc.) keep using compose:
#        docker compose run --rm forwarder login
#
#   3. Edit the per-user services below for your real users and configs.
#      Each service references configs/<short_id>.json by convention.
#
#   4. Bring everything up:
#        docker compose -f docker-compose.users.yml up -d
#        docker compose -f docker-compose.users.yml logs -f forwarder-15e2b0
#        docker compose -f docker-compose.users.yml restart forwarder-15e2b0
#        docker compose -f docker-compose.users.yml down
#
# Tip: put `export COMPOSE_FILE=docker-compose.yml:docker-compose.users.yml`
# in your shell to make `docker compose` commands transparently use both.
#
# All services share /data/sessions, so users.json stays consistent and
# `login` is a one-time-per-user operation regardless of how many forwarders
# are defined.

services:
  # Template service — held back from `up` by `profiles: [never]`. Per-user
  # services below `extends` from this. Edit volumes/env here once and every
  # forwarder picks it up.
  forwarder-base:
    image: telegram-forwarder:latest
    env_file: .env
    volumes:
      - ./data/sessions:/data/sessions
      - ./configs:/app/configs:ro
    # profiles: ["never"]   # template only; never starts on its own
    restart: unless-stopped

  # ============================================================
  # Per-user services. Add one block per user.
  # Convention: configs/<short_id>.json on the host.
  # ============================================================

  # forwarder-15e2b0:
  #   extends:
  #     service: forwarder-base
  #   container_name: tg-forwarder-15e2b0
  #   command: ["forward", "-c", "/app/configs/15e2b0.json"]

  # forwarder-8a9bcf:
  #   extends:
  #     service: forwarder-base
  #   container_name: tg-forwarder-8a9bcf
  #   command: ["forward", "-c", "/app/configs/8a9bcf.json"]
